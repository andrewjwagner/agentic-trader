name: Update market data

on:
  schedule:
    # Hourly on weekdays during US market hours (UTC)
    - cron: "0 14-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-market-data
      - name: Commit updated snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/market-data.json
          if git diff --staged --quiet; then
            echo "No market data changes."
            exit 0
          fi
          git commit -m "Update market-data.json snapshot"
          git push
